<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0618"/>
      <stop offset="40%" stop-color="#1a0a2e"/>
      <stop offset="60%" stop-color="#2d0a1f"/>
      <stop offset="100%" stop-color="#0d0618"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#ff3f7f"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="160" fill="url(#bannerBg)"/>
  <rect width="800" height="160" fill="url(#centerGlow)"/>

  <!-- Top and bottom border lines -->
  <line x1="0" y1="1" x2="800" y2="1" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="159" x2="800" y2="159" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="4" x2="800" y2="4" stroke="#d4af37" stroke-width="0.3" opacity="0.25"/>
  <line x1="0" y1="156" x2="800" y2="156" stroke="#d4af37" stroke-width="0.3" opacity="0.25"/>

  <!-- Left decorative icons -->
  <text x="40" y="90" font-size="32" fill="#d4af37" text-anchor="middle" opacity="0.6" filter="url(#softGlow)">✍</text>
  <text x="100" y="82" font-size="20" fill="#8b1e5a" text-anchor="middle" opacity="0.5">⚡</text>
  <text x="120" y="105" font-size="16" fill="#ff3f7f" text-anchor="middle" opacity="0.4">◆</text>

  <!-- Right decorative icons -->
  <text x="760" y="90" font-size="32" fill="#d4af37" text-anchor="middle" opacity="0.6" filter="url(#softGlow)">✦</text>
  <text x="700" y="82" font-size="20" fill="#8b1e5a" text-anchor="middle" opacity="0.5">⚡</text>
  <text x="680" y="105" font-size="16" fill="#ff3f7f" text-anchor="middle" opacity="0.4">◆</text>

  <!-- Horizontal divider lines -->
  <line x1="140" y1="80" x2="340" y2="80" stroke="#d4af37" stroke-width="0.5" opacity="0.3"/>
  <line x1="460" y1="80" x2="660" y2="80" stroke="#d4af37" stroke-width="0.5" opacity="0.3"/>

  <!-- Center ornaments -->
  <text x="380" y="55" font-size="10" fill="#d4af37" text-anchor="middle" letter-spacing="3" opacity="0.6">✦ ✦ ✦</text>

  <!-- Main title -->
  <text x="400" y="95" font-size="28" fill="url(#titleGrad)" text-anchor="middle" font-weight="bold" letter-spacing="8" font-family="monospace" filter="url(#softGlow)">GENERATORS</text>

  <!-- Subtitle -->
  <text x="400" y="118" font-size="10" fill="#c9a8d4" text-anchor="middle" letter-spacing="4" opacity="0.7">AI-POWERED CONTENT CREATION TOOLS</text>

  <!-- Bottom ornament -->
  <text x="400" y="140" font-size="8" fill="#d4af37" text-anchor="middle" letter-spacing="2" opacity="0.4">BY THE HEADMISTRESS ✦ MISTRESS-X</text>

  <!-- Side particles -->
  <circle cx="160" cy="60" r="2" fill="#d4af37" opacity="0.4"/>
  <circle cx="175" cy="100" r="1.5" fill="#ff3f7f" opacity="0.4"/>
  <circle cx="625" cy="60" r="2" fill="#d4af37" opacity="0.4"/>
  <circle cx="640" cy="100" r="1.5" fill="#ff3f7f" opacity="0.4"/>
</svg>
