<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2d0a1f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d0618" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roseGlow" cx="30%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#ff3f7f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff3f7f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8922a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#ff3f7f"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#bgGlow)"/>
  <rect width="400" height="240" fill="url(#goldGlow)"/>
  <rect width="400" height="240" fill="url(#roseGlow)"/>

  <!-- Border frame -->
  <rect x="8" y="8" width="384" height="224" rx="12" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="12" y="12" width="376" height="216" rx="10" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Corner ornaments -->
  <text x="16" y="30" font-size="14" fill="#d4af37" opacity="0.6">✦</text>
  <text x="368" y="30" font-size="14" fill="#d4af37" opacity="0.6">✦</text>
  <text x="16" y="232" font-size="14" fill="#d4af37" opacity="0.6">✦</text>
  <text x="368" y="232" font-size="14" fill="#d4af37" opacity="0.6">✦</text>

  <!-- Parchment / scroll background -->
  <rect x="60" y="40" width="200" height="160" rx="4" fill="#1a0f0a" opacity="0.7" stroke="#6b4c1a" stroke-width="0.5"/>
  <!-- Parchment lines -->
  <line x1="72" y1="70" x2="248" y2="70" stroke="#6b4c1a" stroke-width="0.5" opacity="0.5"/>
  <line x1="72" y1="85" x2="248" y2="85" stroke="#6b4c1a" stroke-width="0.5" opacity="0.5"/>
  <line x1="72" y1="100" x2="220" y2="100" stroke="#6b4c1a" stroke-width="0.5" opacity="0.5"/>
  <line x1="72" y1="115" x2="235" y2="115" stroke="#6b4c1a" stroke-width="0.5" opacity="0.5"/>
  <line x1="72" y1="130" x2="210" y2="130" stroke="#6b4c1a" stroke-width="0.5" opacity="0.5"/>
  <line x1="72" y1="145" x2="240" y2="145" stroke="#6b4c1a" stroke-width="0.5" opacity="0.5"/>
  <!-- Gold text lines (written text effect) -->
  <line x1="72" y1="70" x2="180" y2="70" stroke="#d4af37" stroke-width="1" opacity="0.7"/>
  <line x1="72" y1="85" x2="160" y2="85" stroke="#d4af37" stroke-width="0.8" opacity="0.5"/>
  <line x1="72" y1="100" x2="195" y2="100" stroke="#d4af37" stroke-width="0.8" opacity="0.5"/>
  <line x1="72" y1="115" x2="145" y2="115" stroke="#d4af37" stroke-width="0.8" opacity="0.4"/>

  <!-- Quill pen -->
  <g transform="translate(210, 50) rotate(-30)" filter="url(#glow)">
    <!-- Feather -->
    <path d="M0,0 C-15,-40 -5,-70 10,-90 C5,-60 0,-30 20,-10 C10,-5 5,0 0,0 Z" fill="url(#quillGrad)" opacity="0.9"/>
    <path d="M0,0 C-10,-30 -2,-60 10,-90 C8,-65 3,-35 15,-12" fill="#b8922a" opacity="0.5"/>
    <!-- Quill tip -->
    <line x1="0" y1="0" x2="0" y2="25" stroke="#d4af37" stroke-width="1.5"/>
    <path d="M0,20 L-3,28 L0,25 L3,28 Z" fill="#d4af37"/>
    <!-- Ink drop -->
    <circle cx="0" cy="30" r="2" fill="#ff3f7f" opacity="0.8"/>
  </g>

  <!-- Right side: UI preview mockup -->
  <rect x="280" y="45" width="96" height="150" rx="6" fill="#1a0a2e" stroke="#d4af37" stroke-width="0.5" stroke-opacity="0.4"/>
  <!-- Mock header bar -->
  <rect x="280" y="45" width="96" height="20" rx="6" fill="#2d0a1f"/>
  <rect x="280" y="57" width="96" height="8" fill="#2d0a1f"/>
  <text x="328" y="58" font-size="6" fill="#d4af37" text-anchor="middle" letter-spacing="1">BLOG GEN</text>
  <!-- Mock form elements -->
  <rect x="288" y="72" width="80" height="8" rx="2" fill="rgba(212,175,55,0.1)" stroke="#d4af37" stroke-width="0.3"/>
  <rect x="288" y="84" width="80" height="20" rx="2" fill="rgba(255,255,255,0.03)" stroke="rgba(212,175,55,0.2)" stroke-width="0.3"/>
  <!-- Source chips -->
  <rect x="288" y="109" width="22" height="7" rx="3" fill="rgba(212,175,55,0.2)" stroke="#d4af37" stroke-width="0.3"/>
  <rect x="313" y="109" width="22" height="7" rx="3" fill="rgba(139,30,90,0.3)" stroke="#8b1e5a" stroke-width="0.3"/>
  <rect x="338" y="109" width="22" height="7" rx="3" fill="rgba(255,63,127,0.2)" stroke="#ff3f7f" stroke-width="0.3"/>
  <!-- Generate button -->
  <rect x="288" y="120" width="80" height="12" rx="4" fill="#d4af37" opacity="0.9"/>
  <text x="328" y="128" font-size="5" fill="#0d0618" text-anchor="middle" font-weight="bold">✦ GENERATE</text>
  <!-- Post/Schedule buttons -->
  <rect x="288" y="136" width="37" height="10" rx="3" fill="#ff3f7f" opacity="0.8"/>
  <rect x="330" y="136" width="38" height="10" rx="3" fill="#8b1e5a" opacity="0.8"/>
  <text x="306" y="143" font-size="4" fill="#fff" text-anchor="middle">POST NOW</text>
  <text x="349" y="143" font-size="4" fill="#fff" text-anchor="middle">SCHEDULE</text>
  <!-- Status dot -->
  <circle cx="290" cy="153" r="3" fill="#22c55e"/>
  <text x="297" y="156" font-size="4" fill="#22c55e">Connected</text>

  <!-- Door preview mini element -->
  <rect x="288" y="162" width="80" height="25" rx="3" fill="#1a0a2e" stroke="#d4af37" stroke-width="0.5"/>
  <text x="328" y="172" font-size="5" fill="#d4af37" text-anchor="middle">THE DOOR AWAITS</text>
  <rect x="306" y="176" width="44" height="7" rx="2" fill="#d4af37" opacity="0.8"/>
  <text x="328" y="181" font-size="4" fill="#0d0618" text-anchor="middle" font-weight="bold">ENTER MISTRESS-X</text>

  <!-- Title text -->
  <text x="160" y="210" font-size="13" fill="url(#titleGrad)" text-anchor="middle" font-weight="bold" letter-spacing="3" font-family="monospace">BLOG GENERATOR</text>
  <text x="160" y="224" font-size="7" fill="#c9a8d4" text-anchor="middle" letter-spacing="2" opacity="0.7">HEADMISTRESS INTELLIGENCE</text>

  <!-- Decorative particles -->
  <circle cx="45" cy="50" r="1.5" fill="#d4af37" opacity="0.6"/>
  <circle cx="355" cy="185" r="1.5" fill="#ff3f7f" opacity="0.6"/>
  <circle cx="30" cy="130" r="1" fill="#8b1e5a" opacity="0.8"/>
  <circle cx="370" cy="100" r="1" fill="#d4af37" opacity="0.4"/>
</svg>
